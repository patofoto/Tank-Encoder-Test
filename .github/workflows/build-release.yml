name: Build and Release Firmware

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO Core
        uses: platformio/action-install-platformio-core@v1
      
      - name: Build firmware
        run: |
          pio run -e teensy41
      
      - name: Extract version from tag
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          else
            VERSION="dev-$(date +%Y%m%d-%H%M%S)"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$VERSION" >> $GITHUB_OUTPUT
          fi
      
      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          cp .pio/build/teensy41/firmware.hex release_assets/tank_encoder_firmware.hex
          cp .pio/build/teensy41/firmware.hex "release_assets/tank_encoder_v${{ steps.get_version.outputs.version }}.hex"
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release_assets/*
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## Firmware Release ${{ steps.get_version.outputs.version }}
            
            ### Installation Instructions
            
            1. Download the `tank_encoder_firmware.hex` file
            2. Install [Teensy Loader Application](https://www.pjrc.com/teensy/loader.html)
            3. Connect your Teensy 4.1 via USB
            4. Put the device into program mode (press the button)
            5. Open Teensy Loader and load the `.hex` file
            6. Click "Program" to flash the firmware
            
            See FIRMWARE_FLASHING_GUIDE.md for detailed instructions.
          draft: false
          prerelease: false
